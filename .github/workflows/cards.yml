name: Daily Postcards

on:
  schedule:
    # 03:00, 15:00, 19:00 UTC = 06:00, 18:00, 22:00
    - cron: '0 3,15,19 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-generativeai requests Pillow

      - name: Run Cards Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CARDS_CHAT_ID: ${{ secrets.CARDS_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python cards.py
