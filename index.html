<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Монитор: Геоэкономика & Мода</title>
  <script src="[https://telegram.org/js/telegram-web-app.js](https://telegram.org/js/telegram-web-app.js)"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #0f172a);
      --card-bg: var(--tg-theme-secondary-bg-color, #1e293b);
      --text-main: var(--tg-theme-text-color, #f8fafc);
      --text-muted: var(--tg-theme-hint-color, #94a3b8);
      --accent: var(--tg-theme-button-color, #38bdf8);
      --border: #334155;
      --fashion-accent: #f43f5e;
    }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      -webkit-tap-highlight-color: transparent;
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    .tab-btn {
      flex: 1;
      padding: 12px 8px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-muted);
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .tab-btn.active {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border-color: var(--accent);
    }
    .tab-btn.active.fashion {
      background: rgba(244, 63, 94, 0.15);
      color: var(--fashion-accent);
      border-color: var(--fashion-accent);
    }
    .history-bar { margin-bottom: 14px; }
    select {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      width: 100%;
      outline: none;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 0 0 10px 0;
    }
    .summary { font-size: 0.95rem; line-height: 1.45; margin-bottom: 10px; }
    .impact-box {
      background: rgba(245, 158, 11, 0.1);
      border-left: 3px solid #f59e0b;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.9rem;
      margin-bottom: 10px;
    }
    details { border-top: 1px dashed var(--border); padding-top: 10px; margin-top: 10px; }
    summary { font-size: 0.9rem; font-weight: 600; color: var(--accent); cursor: pointer; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    
    .fashion-img {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    .fashion-tag {
      display: inline-block;
      background: rgba(244, 63, 94, 0.15);
      color: var(--fashion-accent);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .fashion-meta {
      font-size: 0.92rem;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    /* Визуальная палитра (свотчи цветов) */
    .palette-container {
      margin: 10px 0 14px 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .palette-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .swatches {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .swatch-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 10px 4px 5px;
      font-size: 0.82rem;
    }
    .swatch-circle {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.25);
      flex-shrink: 0;
    }
    .hex-code {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-left: 2px;
    }
  </style>
</head>
<body>

  <div class="tabs">
    <button class="tab-btn active" id="tab-geo" onclick="switchTab('geo')">🌐 Геоэкономика</button>
    <button class="tab-btn" id="tab-fashion" onclick="switchTab('fashion')">👗 Мода & Стиль</button>
  </div>

  <div id="geo-section">
    <div class="history-bar">
      <select id="edition-select"><option>Загрузка архива...</option></select>
    </div>
    <div id="geo-cards">Загрузка данных...</div>
  </div>

  <div id="fashion-section" style="display: none;">
    <div id="fashion-cards">Загрузка образов...</div>
  </div>

  <script>
    let globalHistory = [];

    function switchTab(tab) {
      if (tab === 'geo') {
        document.getElementById('geo-section').style.display = 'block';
        document.getElementById('fashion-section').style.display = 'none';
        document.getElementById('tab-geo').className = 'tab-btn active';
        document.getElementById('tab-fashion').className = 'tab-btn';
      } else {
        document.getElementById('geo-section').style.display = 'none';
        document.getElementById('fashion-section').style.display = 'block';
        document.getElementById('tab-geo').className = 'tab-btn';
        document.getElementById('tab-fashion').className = 'tab-btn active fashion';
        loadFashion();
      }
    }

    fetch('data.json?v=' + new Date().getTime())
      .then(res => res.json())
      .then(data => {
        const select = document.getElementById('edition-select');
        select.innerHTML = '';
        if (data.history) {
          globalHistory = data.history;
          globalHistory.forEach((entry, i) => {
            const opt = document.createElement('option');
            opt.value = i;
            opt.innerText = `📅 Выпуск: ${entry.timestamp}`;
            select.appendChild(opt);
          });
          renderGeo(globalHistory[0].cards);
        }
        select.addEventListener('change', (e) => renderGeo(globalHistory[e.target.value].cards));
      });

    function renderGeo(cards) {
      const container = document.getElementById('geo-cards');
      container.innerHTML = '';
      cards.forEach(item => {
        const c = document.createElement('div');
        c.className = 'card';
        c.innerHTML = `
          <div class="card-title">${item.icon || '🔹'} ${item.category}</div>
          <div class="summary">${item.summary}</div>
          ${item.impact ? `<div class="impact-box"><strong>💡 Прикладной вывод:</strong> ${item.impact}</div>` : ''}
          <details><summary>↓ Анализ и цепочки</summary><div style="margin-top:8px;font-size:0.88rem;color:var(--text-muted);">${item.mechanism || ''}</div></details>
        `;
        container.appendChild(c);
      });
    }

    let fashionLoaded = false;
    function loadFashion() {
      if (fashionLoaded) return;
      fetch('fashion_data.json?v=' + new Date().getTime())
        .then(res => res.json())
        .then(items => {
          fashionLoaded = true;
          const container = document.getElementById('fashion-cards');
          container.innerHTML = '';
          items.forEach(item => {
            let paletteHtml = '';
            if (item.palette && Array.isArray(item.palette)) {
              paletteHtml = `
                <div class="palette-container">
                  <div class="palette-title">🎨 Палитра сезона:</div>
                  <div class="swatches">
                    ${item.palette.map(p => `
                      <div class="swatch-chip">
                        <span class="swatch-circle" style="background-color: ${p.hex || '#666'};"></span>
                        <span><strong>${p.name || ''}</strong> <span class="hex-code">${p.hex || ''}</span></span>
                      </div>
                    `).join('')}
                  </div>
                </div>`;
            } else if (item.colors) {
              paletteHtml = `<div class="fashion-meta">🎨 <strong>Палитра:</strong> ${item.colors}</div>`;
            }

            const c = document.createElement('div');
            c.className = 'card';
            c.innerHTML = `
              <span class="fashion-tag">${item.brand} • ${item.date || 'Новинка'}</span>
              <div class="card-title">${item.topic}</div>
              ${item.image_url ? `<img src="${item.image_url}" class="fashion-img" onerror="this.style.display='none'">` : ''}
              ${paletteHtml}
              <div class="fashion-meta">✂️ <strong>Крой:</strong> ${item.cut_silhouette}</div>
              <div class="fashion-meta">🧵 <strong>Материалы:</strong> ${item.materials}</div>
              <div class="impact-box" style="border-left-color: #f43f5e; background: rgba(244, 63, 94, 0.1);">
                <strong>💡 Для гардероба:</strong> ${item.practical_tip}
              </div>
            `;
            container.appendChild(c);
          });
        })
        .catch(() => {
          document.getElementById('fashion-cards').innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);">Первый модный выпуск формируется...</div>';
        });
    }
  </script>
</body>
</html>
