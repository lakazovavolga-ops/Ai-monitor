<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Глобальный Геоэкономический Монитор</title>
  <script src="[https://telegram.org/js/telegram-web-app.js](https://telegram.org/js/telegram-web-app.js)"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #0f172a);
      --card-bg: var(--tg-theme-secondary-bg-color, #1e293b);
      --text-main: var(--tg-theme-text-color, #f8fafc);
      --text-muted: var(--tg-theme-hint-color, #94a3b8);
      --accent: var(--tg-theme-button-color, #38bdf8);
      --border: #334155;
      --impact-bg: rgba(245, 158, 11, 0.1);
      --impact-border: #f59e0b;
    }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      -webkit-tap-highlight-color: transparent;
    }
    header {
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    h1 {
      font-size: 1.25rem;
      margin: 0 0 6px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 0.75rem;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }
    .history-bar {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    select {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      width: 100%;
      outline: none;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0 0 10px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .summary {
      font-size: 0.95rem;
      line-height: 1.45;
      margin-bottom: 10px;
    }
    .impact-box {
      background: var(--impact-bg);
      border-left: 3px solid var(--impact-border);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.88rem;
      line-height: 1.4;
      margin-bottom: 10px;
    }
    .impact-box strong {
      color: #fbbf24;
    }
    details {
      border-top: 1px dashed var(--border);
      padding-top: 10px;
      margin-top: 10px;
    }
    summary {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: "↓ Анализ и цепочки"; }
    details[open] summary::after { content: "↑ Свернуть"; }
    .deep-dive {
      margin-top: 10px;
      font-size: 0.88rem;
      line-height: 1.4;
      color: var(--text-muted);
    }
    .deep-dive p { margin: 6px 0; }
    .deep-dive strong { color: var(--text-main); }
    #loading {
      text-align: center;
      color: var(--text-muted);
      padding: 30px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🌐 Терминал Аналитики <span class="badge">LIVE</span></h1>
    <div class="history-bar">
      <select id="edition-select">
        <option>Загрузка архива...</option>
      </select>
    </div>
  </header>

  <div id="cards-container">
    <div id="loading">Загрузка данных...</div>
  </div>

  <script>
    let globalHistory = [];

    function renderCards(cards) {
      const container = document.getElementById('cards-container');
      container.innerHTML = '';
      cards.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-title">${item.icon || '🔹'} ${item.category}</div>
          <div class="summary">${item.summary}</div>
          ${item.impact ? `
            <div class="impact-box">
              <strong>💡 Прикладной вывод:</strong> ${item.impact}
            </div>` : ''}
          <details>
            <summary></summary>
            <div class="deep-dive">
              ${item.mechanism ? `<p><strong>Цепочки и механизм:</strong> ${item.mechanism}</p>` : ''}
              ${item.precedent ? `<p><strong>Исторический прецедент:</strong> ${item.precedent}</p>` : ''}
            </div>
          </details>
        `;
        container.appendChild(card);
      });
    }

    fetch('data.json?v=' + new Date().getTime())
      .then(res => res.json())
      .then(data => {
        const select = document.getElementById('edition-select');
        select.innerHTML = '';

        if (data.history && Array.isArray(data.history)) {
          globalHistory = data.history;
          globalHistory.forEach((entry, index) => {
            const opt = document.createElement('option');
            opt.value = index;
            opt.innerText = `📅 Выпуск: ${entry.timestamp}`;
            select.appendChild(opt);
          });
          renderCards(globalHistory[0].cards);
        } else if (Array.isArray(data)) {
          const opt = document.createElement('option');
          opt.innerText = '📅 Текущий выпуск';
          select.appendChild(opt);
          renderCards(data);
        }

        select.addEventListener('change', (e) => {
          const idx = e.target.value;
          if (globalHistory[idx]) {
            renderCards(globalHistory[idx].cards);
          }
        });
      })
      .catch(err => {
        document.getElementById('loading').innerText = 'Ошибка загрузки архива.';
      });
  </script>
</body>
</html>
