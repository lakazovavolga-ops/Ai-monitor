<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Глобальный Геоэкономический Монитор</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #0f172a);
      --card-bg: var(--tg-theme-secondary-bg-color, #1e293b);
      --text-main: var(--tg-theme-text-color, #f8fafc);
      --text-muted: var(--tg-theme-hint-color, #94a3b8);
      --accent: var(--tg-theme-button-color, #38bdf8);
      --accent-text: var(--tg-theme-button-text-color, #0f172a);
      --border: #334155;
    }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      -webkit-tap-highlight-color: transparent;
    }
    header {
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    h1 {
      font-size: 1.2rem;
      margin: 0 0 6px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 0.75rem;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }
    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin: 0;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .card-title {
      font-size: 1rem;
      font-weight: 700;
      margin: 0 0 10px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .summary {
      font-size: 0.95rem;
      line-height: 1.45;
      margin-bottom: 12px;
    }
    details {
      border-top: 1px dashed var(--border);
      padding-top: 10px;
      margin-top: 10px;
    }
    summary {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    summary::-webkit-details-marker {
      display: none;
    }
    summary::after {
      content: "↓ Развернуть анализ";
    }
    details[open] summary::after {
      content: "↑ Свернуть";
    }
    .deep-dive {
      margin-top: 10px;
      font-size: 0.88rem;
      line-height: 1.4;
      color: var(--text-muted);
    }
    .deep-dive p {
      margin: 6px 0;
    }
    .deep-dive strong {
      color: var(--text-main);
    }
    #loading {
      text-align: center;
      color: var(--text-muted);
      padding: 30px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>🌐 Терминал Аналитики <span class="badge">LIVE</span></h1>
    <p class="subtitle">Сквозной геоэкономический монитор и исторические маркеры</p>
  </header>

  <div id="cards-container">
    <div id="loading">Загрузка свежих данных мониторинга...</div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Загружаем сгенерированный AI файл data.json
    fetch('data.json?v=' + new Date().getTime())
      .then(response => {
        if (!response.ok) throw new Error('Данные еще формируются');
        return response.json();
      })
      .then(data => {
        const container = document.getElementById('cards-container');
        container.innerHTML = '';

        data.forEach(item => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="card-title">${item.icon || '🔹'} ${item.category}</div>
            <div class="summary">${item.summary}</div>
            <details>
              <summary></summary>
              <div class="deep-dive">
                ${item.mechanism ? `<p><strong>Механизм:</strong> ${item.mechanism}</p>` : ''}
                ${item.precedent ? `<p><strong>Прецедент:</strong> ${item.precedent}</p>` : ''}
                ${item.impact ? `<p><strong>Влияние на жизнь:</strong> ${item.impact}</p>` : ''}
              </div>
            </details>
          `;
          container.appendChild(card);
        });
      })
      .catch(err => {
        document.getElementById('loading').innerText = 'Загружаются актуальные данные... Обновите страницу через минуту.';
      });
  </script>
</body>
</html>
